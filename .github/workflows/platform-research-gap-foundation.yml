name: Platform Research Gap Foundation

on:
  pull_request:
  push:
    branches: [main]

jobs:
  research-gap-foundation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Research foundation tests
        run: python -m unittest tests.test_research_gap_foundation -v
      - name: Full Python suite
        run: python -m unittest discover -s tests -v
      - name: Import and serialization smoke
        run: |
          python - <<'PY'
          from backend.platform.research.models import ResearchGap
          from backend.platform.research.registry import ResearchRegistry
          gap = ResearchGap("ci-gap", "fixture", "what evidence is needed?")
          registry = ResearchRegistry([gap])
          assert registry.to_dict()["gaps"][0]["state"] == "RESEARCH"
          print(registry.to_dict())
          PY
      - name: Safety boundary
        shell: bash
        run: |
          if grep -RniE 'format-volume|Clear-Disk|Set-Partition|bcdedit[[:space:]]+/delete|Disable-SecureBoot|Set-SecureBootUEFI|diskpart.*clean|efibootmgr[[:space:]].*(create|delete)' backend/platform/research 2>/dev/null; then
            echo "Unsafe mutation command detected in research foundation"; exit 1
          fi
