name: Platform Research Cases

on:
  pull_request:
  push:
    branches: [main]

jobs:
  research-cases:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Research case tests
        run: python -m unittest tests/test_research_cases.py -v
      - name: Full Python suite
        run: python -m unittest discover -s tests -v
      - name: Case lifecycle smoke
        run: |
          python - <<'PY'
          from backend.platform.research.cases import ResearchCaseEngine
          from backend.platform.research.models import ResearchGap
          case = ResearchCaseEngine().create(ResearchGap("gap-smoke", "fixture", "What is known?"), "unknown").begin()
          assert case.state.value == "RESEARCHING"
          print(case.to_dict())
          PY
      - name: Safety boundary
        shell: bash
        run: |
          if grep -RniE 'format-volume|Clear-Disk|Set-Partition|bcdedit[[:space:]]+/delete|Disable-SecureBoot|Set-SecureBootUEFI|diskpart.*clean|efibootmgr[[:space:]].*(create|delete)' backend/platform/research 2>/dev/null; then
            echo "Unsafe mutation command detected"; exit 1
          fi
