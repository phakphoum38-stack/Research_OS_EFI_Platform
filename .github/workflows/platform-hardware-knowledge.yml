name: Platform Hardware Knowledge

on:
  pull_request:
  push:
    branches: [main]

jobs:
  hardware-knowledge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Hardware knowledge tests
        run: python -m unittest tests/test_hardware_knowledge.py -v
      - name: Full Python suite
        run: python -m unittest discover -s tests -v
      - name: Snapshot graph smoke
        run: |
          python - <<'PY'
          from backend.platform.hardware_knowledge import graph_from_snapshot
          from backend.platform.universal.models import HardwareSnapshot, ProductIdentity
          graph = graph_from_snapshot(HardwareSnapshot(platform="linux", product=ProductIdentity(product="fixture")))
          assert len(graph.nodes) == 2
          print(graph.to_dict())
          PY
      - name: Safety boundary
        shell: bash
        run: |
          if grep -RniE 'format-volume|Clear-Disk|Set-Partition|bcdedit[[:space:]]+/delete|Disable-SecureBoot|Set-SecureBootUEFI|diskpart.*clean|efibootmgr[[:space:]].*(create|delete)' backend/platform 2>/dev/null; then
            echo "Unsafe mutation command detected"; exit 1
          fi
