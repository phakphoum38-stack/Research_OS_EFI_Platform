name: AI EFI Compatibility Gate

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  compatibility-gate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Run compatibility tests
        run: python -m unittest discover -s tests -v

      - name: Evaluate X1504VA and build safe candidate
        run: |
          PYTHONPATH=. python - <<'PY'
          import json
          from backend.builder.efi_builder import build_efi

          with open("hardware/x1504va.json", encoding="utf-8") as handle:
              profile = json.load(handle)

          result = build_efi(profile, strict=True)
          print(json.dumps(result, indent=2))

          if result["status"] != "EFI_BLOCKED":
              raise SystemExit("Expected the current X1504VA profile to remain blocked until GPU/VMD evidence is proven")
          PY

      - name: Upload compatibility evidence
        uses: actions/upload-artifact@v4
        with:
          name: x1504va-compatibility-evidence
          path: EFI/OC/compatibility-report.json
