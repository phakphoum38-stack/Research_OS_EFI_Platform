name: Platform Product Universe

on:
  pull_request:
  push:
    branches: [main]

jobs:
  product-universe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Product universe tests
        run: python -m unittest tests.test_product_universe -v
      - name: Full Python suite
        run: python -m unittest discover -s tests -v
      - name: Catalog smoke
        run: |
          python - <<'PY'
          from backend.platform.universe.catalog import ProductCatalog, ProductModel
          catalog = ProductCatalog()
          catalog.add_model(ProductModel("ASUS", "Vivobook", "X1504VA"))
          assert len(catalog.to_dict()["models"]) == 1
          print(catalog.to_dict())
          PY
      - name: Safety boundary
        shell: bash
        run: |
          if grep -RniE 'format-volume|Clear-Disk|Set-Partition|bcdedit[[:space:]]+/delete|Disable-SecureBoot|Set-SecureBootUEFI|diskpart.*clean|efibootmgr[[:space:]].*(create|delete)' backend/platform/universe 2>/dev/null; then
            echo "Unsafe mutation command detected in product universe"; exit 1
          fi
