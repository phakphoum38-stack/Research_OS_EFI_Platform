name: Platform Core

on:
  pull_request:
  push:
    branches: [main]

jobs:
  python-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Python tests
        run: python -m unittest discover -s tests -v

  flutter-control-center:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/x1504va_control_center
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          channel: stable
      - name: Flutter tests
        run: flutter test
